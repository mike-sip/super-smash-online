# Intégration continue de Fracas : à chaque pull request et à chaque envoi sur main.
#
# - « Vérifications » : lint, typecheck, tests unitaires (déterminisme dans Edge, Firefox et WebKit
#   compris), puis tests de bout en bout sur le build de production.
# - « Images Docker » : construit les deux images de production, valide la configuration de Caddy et
#   vérifie qu'il sert bien les modèles précompressés.
#
# La mesure de performance (`pnpm --filter @game/app perf`) n'y est pas : sur une machine partagée,
# sans carte graphique, ses temps ne veulent rien dire. Elle se lance à la main (SPEC-app-shell.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Version de pnpm : celle de `packageManager` dans package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      # Edge pour les tests de navigateur, Firefox et WebKit pour le déterminisme entre moteurs.
      - name: Navigateurs de test
        run: pnpm --filter @game/sim-core exec playwright-core install --with-deps msedge firefox webkit

      - name: Lint
        run: pnpm lint

      - name: Formatage
        run: pnpm exec prettier --check .

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm --filter "./packages/**" -r test

      - name: Tests du jeu
        run: pnpm --filter @game/app test

      # Contenu du build public : ni prise de test, ni clé de développement, ni carte des sources.
      - name: Build de production
        working-directory: apps/game
        run: |
          pnpm exec vite build
          pnpm exec vitest run --config vitest.e2e.config.ts test/e2e/build.test.ts

      # Les tests de bout en bout jouent de vrais matchs en 3D dans plusieurs onglets Edge, avec les
      # serveurs de jeu et de comptes sur la même machine. Sans carte graphique, le rendu est fait
      # par le processeur et tout est 5 à 10 fois plus lent qu'un poste : leurs attentes y expirent
      # sans que le jeu soit en cause. Ils tournent ici à titre indicatif (un échec est signalé, il ne
      # bloque pas) et font foi sur un poste de travail, comme les deux démos de développement.
      - name: Tests de bout en bout (indicatif)
        continue-on-error: true
        run: pnpm --filter @game/app test:e2e

      - name: Démos de développement (indicatif)
        continue-on-error: true
        run: >
          pnpm --filter @game/demo --filter @game/online -r --workspace-concurrency=1
          run test --no-file-parallelism

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Image des serveurs
        run: docker build -f deploy/Dockerfile --target server -t fracas-server:ci .

      - name: Image du frontal
        run: docker build -f deploy/Dockerfile --target web -t fracas-web:ci .

      # Valeurs factices, propres à la CI : seule la forme de la composition est vérifiée.
      - name: Configuration de la composition
        env:
          DOMAIN: fracas.example
          ACME_EMAIL: ci@fracas.example
          ACCOUNTS_TICKET_SECRETS: ci-cle-de-ticket-factice-0123456789abcdef
          RANKING_REPORT_SECRETS: ci-cle-de-rapport-factice-0123456789abcdef
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Configuration de Caddy
        run: >
          docker run --rm -e DOMAIN=fracas.example -e ACME_EMAIL=ci@fracas.example fracas-web:ci
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Modèles et HDRI précompressés
        run: >
          docker run --rm --entrypoint sh fracas-web:ci -c
          'ls /srv/fighters/*/model.glb.gz && ls /srv/hdri/*.hdr.gz'

      # En HTTP local (pas de certificat) : le frontal sert la version .gz aux navigateurs qui
      # l'acceptent, avec le bon type.
      - name: Service des fichiers précompressés
        run: |
          docker run -d --name web -p 8080:8080 \
            -e DOMAIN=http://localhost:8080 -e ACME_EMAIL=ci@fracas.example fracas-web:ci
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done
          headers=$(curl -sf -D - -o /dev/null -H 'Accept-Encoding: gzip' \
            http://localhost:8080/fighters/sorel/model.glb)
          echo "$headers"
          echo "$headers" | grep -qi '^content-encoding: gzip'
          echo "$headers" | grep -qi '^cache-control: no-cache'
          docker rm -f web

      - name: Serveurs
        run: docker run --rm fracas-server:ci node -e "console.log(process.version)"
