<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Démo de combat</title>
    <!-- Pas d'icône : évite une requête en échec dans la console. -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b2233;
        font-family: system-ui, sans-serif;
      }
      #game,
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #game {
        display: block;
      }
      #overlay {
        pointer-events: none;
      }
      #status {
        position: absolute;
        left: 50%;
        top: 74px;
        transform: translateX(-50%);
        padding: 2px 10px;
        border-radius: 4px;
        background: rgba(15, 23, 42, 0.72);
        color: #fde68a;
        font-size: 13px;
        pointer-events: none;
      }
      #status:empty {
        display: none;
      }
      #toolbar {
        position: absolute;
        right: 12px;
        bottom: 10px;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        max-width: 50%;
      }
      #toolbar button {
        padding: 4px 8px;
        border: 1px solid #64748b;
        border-radius: 4px;
        background: rgba(15, 23, 42, 0.72);
        color: #cbd5e1;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #toolbar button[aria-pressed='true'] {
        border-color: #facc15;
        color: #facc15;
      }
      #tuning {
        position: absolute;
        top: 70px;
        right: 12px;
        bottom: 80px;
        width: 270px;
        padding: 8px 12px;
        overflow-y: auto;
        border: 1px solid #475569;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.9);
        color: #cbd5e1;
        font-size: 12px;
      }
      #tuning h2,
      #tuning h3 {
        margin: 8px 0 4px;
        font-size: 13px;
        color: #f8fafc;
      }
      #tuning h3 {
        font-size: 12px;
        color: #94a3b8;
      }
      #tuning label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin: 2px 0;
      }
      #tuning label.changed span {
        color: #facc15;
      }
      #tuning input {
        width: 72px;
      }
      #tuning textarea {
        width: 100%;
        box-sizing: border-box;
        font:
          11px ui-monospace,
          Consolas,
          monospace;
      }
      #tuning button {
        margin-top: 8px;
      }
      #remap {
        position: absolute;
        top: 70px;
        left: 12px;
        bottom: 80px;
        width: 290px;
        padding: 8px 12px;
        overflow-y: auto;
        border: 1px solid #475569;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.9);
        color: #cbd5e1;
        font-size: 12px;
      }
      #remap h2 {
        margin: 8px 0 4px;
        font-size: 13px;
        color: #f8fafc;
      }
      #remap select {
        width: 100%;
      }
      #remap .message {
        min-height: 2.6em;
        margin: 6px 0;
        color: #fde68a;
      }
      #remap label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin: 2px 0;
      }
      #remap label button {
        min-width: 110px;
      }
      #remap input[type='number'] {
        width: 56px;
      }
      #help {
        max-width: 48%;
        position: absolute;
        left: 12px;
        bottom: 10px;
        margin: 0;
        color: #cbd5e1;
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
      }
      #help kbd {
        padding: 0 4px;
        border: 1px solid #64748b;
        border-radius: 3px;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="overlay"></div>
    <p id="help">
      <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> stick · <kbd>Z</kbd> saut ·
      <kbd>X</kbd> attaque · <kbd>C</kbd> spécial · <kbd>V</kbd> bouclier · <kbd>B</kbd> saisie ·
      <kbd>I</kbd> <kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd> stick droit · <kbd>Maj</kbd> marcher<br />
      Manette : appuyez sur un bouton pour rejoindre, jusqu'à 4 joueurs. Adresse :
      <code>?dummies=1…7&amp;mode=idle|random</code>
    </p>
    <div id="tuning" hidden></div>
    <div id="remap" hidden></div>
    <div id="status" role="status"></div>
    <div id="toolbar"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
